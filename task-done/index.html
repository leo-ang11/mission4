<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <title>Task Done</title>
    <link rel="stylesheet" href="../ui-style.css">
</head>
<body>
    <div class="container">
        <div class="top-container">
            <div class="logo">
                <figure>
                    <img src="https://img.kkbahagia.com/?width=256&image=https%3A%2F%2Fcdn.harisenin.com%2Fpublic%2Fassets%2Flogos%2Flogo_harisenin.svg" alt="logo">
                </figure>
            </div>
            <div class="profile-data">
                <figure>
                    <img src="../image/pexels-sulimansallehi-1704488.jpg" alt="image profile">
                </figure>
                <div class="info-profile-data">
                    <h4>Jack Doe</h4>
                     <p>Manager</p>
                </div>
            </div>
        </div>
        <div class="header">
            <div class="list-header-btn">
                <a href="/all-task/" class="all-btn">All Task</a >
                <a href="/today-task/" class="today-btn">Today's Task</a>
                <button class="done-btn active">Task Done</button>
            </div>
        </div>
        <div class="box-content">
            <div class="content content-all-task">
                <div class="header-content">
                    <div class="time-info-header">
                        <h1>Task Done</h1>
                        <p>Below is a list of completed tasks</p>
                    </div>
                    <button class="new-task-btn" id="del-all-content">
                        <span>
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path d="M5.47058 6.01471V18.5294C5.47058 19.251 5.75721 19.943 6.26742 20.4532C6.77763 20.9634 7.46962 21.25 8.19117 21.25H15.8088C16.5304 21.25 17.2224 20.9634 17.7326 20.4532C18.2428 19.943 18.5294 19.251 18.5294 18.5294V6.01471" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                                <path d="M3.29413 6.01471H20.7059" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                                <path d="M8.73529 6.01471V4.38235C8.73529 3.94943 8.90727 3.53423 9.2134 3.2281C9.51952 2.92198 9.93472 2.75 10.3676 2.75H13.6323C14.0653 2.75 14.4805 2.92198 14.7866 3.2281C15.0927 3.53423 15.2647 3.94943 15.2647 4.38235V6.01471" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                                <path d="M9.82352 16.9915V11.5535" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                                <path d="M14.1765 16.9915V11.5535" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                            </svg>                                
                        </span>
                        Delete All
                    </button>
                </div>
                <div class="tasks" id="all-task-completed-here">
                    
                </div>
            </div>
        </div>
    </div>

    <div class="out-add-task">
        <div class="box-add-task">
            <div class="task-input">
                <textarea id="task" placeholder="Tulis tugas di sini..."></textarea>
                <select id="priority">
                    <option value="Low">Low</option>
                    <option value="Normal">Normal</option>
                    <option value="Urgent">Urgent</option>
                </select>
                <!-- jadwal -->
                 <div class="date-picker">
                    <input type="date" id="day-schedule">
                    <input type="time" id="start-schedule">
                    <input type="time" id="end-schedule">

                    <p id="formatted-date"></p>
                 </div>
                <button id="submit">Submit</button>
            </div>
        </div>
    </div>

    

    <script>

        document.addEventListener("DOMContentLoaded", showDoneData);

        let Containertaskcompleted = document.getElementById('all-task-completed-here');

        function showDoneData() {
            // Ambil data tugas yang sudah ada di localStorage, atau buat array kosong jika belum ada
            let tasks = JSON.parse(localStorage.getItem('tasksData')) || [];

            // Filter tugas yang sudah selesai (completed === true)
            let TaskCompleted = tasks.filter(item => item.completed === true);

            Containertaskcompleted.innerHTML = '';

            if (TaskCompleted.length === 0) {
                let noDataMessage = document.createElement('p');
                noDataMessage.textContent = 'No Data';
                noDataMessage.className = "empty-data";
                Containertaskcompleted.appendChild(noDataMessage);
            } else {
                TaskCompleted.forEach((taskData) => {
                    let cardtask = document.createElement('div');
                    cardtask.className = "task";
                    cardtask.classList.add('completed');
                    cardtask.innerHTML = `
                        <div>
                            <span class="task-id hide">${taskData.id}</span>
                            <h2>${taskData.title}</h2>
                            <p>${taskData.dayschedule} | ${taskData.startschedule} - ${taskData.endschedule}</p>
                            <p id="pr-s"> Priority: ${taskData.priority}</p>
                        </div>
                        <div class="status">
                            <span class="completed-icon">
                                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                    <path d="M12 1.75C9.97276 1.75 7.99098 2.35115 6.30538 3.47743C4.61977 4.60372 3.30603 6.20456 2.53023 8.0775C1.75443 9.95044 1.55142 12.0114 1.94692 13.9997C2.34242 15.988 3.31867 17.8144 4.75215 19.2478C6.18564 20.6813 8.01202 21.6575 10.0003 22.053C11.9886 22.4485 14.0496 22.2456 15.9225 21.4698C17.7954 20.694 19.3963 19.3802 20.5225 17.6946C21.6488 16.009 22.25 14.0273 22.25 12C22.2474 9.28234 21.1666 6.67676 19.2449 4.75508C17.3232 2.83341 14.7177 1.75265 12 1.75ZM17.07 10.09L11.7 15.46C11.5177 15.6519 11.2959 15.8021 11.05 15.9C10.5526 16.0997 9.99739 16.0997 9.50002 15.9C9.25642 15.7977 9.03547 15.6482 8.84999 15.46L6.19002 12.8C6.09629 12.707 6.02186 12.5964 5.97109 12.4746C5.92032 12.3527 5.89418 12.222 5.89418 12.09C5.89418 11.958 5.92032 11.8273 5.97109 11.7054C6.02186 11.5836 6.09629 11.473 6.19002 11.38C6.37738 11.1938 6.63079 11.0892 6.89498 11.0892C7.15916 11.0892 7.41263 11.1938 7.59999 11.38L10.27 14.05L15.65 8.67999C15.7429 8.58626 15.8536 8.51187 15.9754 8.46111C16.0973 8.41034 16.228 8.3842 16.36 8.3842C16.492 8.3842 16.6227 8.41034 16.7446 8.46111C16.8664 8.51187 16.977 8.58626 17.07 8.67999C17.2473 8.86597 17.3462 9.11305 17.3462 9.37C17.3462 9.62694 17.2473 9.87402 17.07 10.06V10.09Z" fill="currentColor"/>
                                </svg>    
                            </span>
                        </div>
                    `;
                    Containertaskcompleted.appendChild(cardtask);
                });
            }

            // Tombol untuk menghapus tugas yang sudah selesai
            let deleteButton = document.getElementById('del-all-content');
            deleteButton.addEventListener('click', function() {
                // Ambil data tugas dari localStorage
                let tasks = JSON.parse(localStorage.getItem('tasksData')) || [];

                // Filter tugas yang tidak completed
                let remainingTasks = tasks.filter(item => item.completed !== true);

                // Simpan kembali data yang tidak dihapus ke localStorage
                localStorage.setItem('tasksData', JSON.stringify(remainingTasks));

                // Update tampilan
                Containertaskcompleted.innerHTML = '<p class="empty-data">No Data</p>';
                showDoneData(); // Panggil showDoneData lagi untuk memperbarui tampilan
            });
        }


    </script>

</body>
</html>
