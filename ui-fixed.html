<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <title>Document</title>
    <link rel="stylesheet" href="ui-style.css">
</head>
<body>
    <div class="container">
        <div class="top-container">
            <div class="logo">
                <figure>
                    <img src="https://img.kkbahagia.com/?width=256&image=https%3A%2F%2Fcdn.harisenin.com%2Fpublic%2Fassets%2Flogos%2Flogo_harisenin.svg" alt="logo">
                </figure>
            </div>
            <div class="profile-data">
                <figure>
                    <img src="image/pexels-sulimansallehi-1704488.jpg" alt="image profile">
                </figure>
                <div class="info-profile-data">
                    <h4>Jack Doe</h4>
                     <p>Manager</p>
                </div>
            </div>
        </div>
        <div class="header">
            <div class="list-header-btn">
                <button class="all-btn">All Task</button>
                <button class="today-btn">Today's Task</button>
                <button class="done-btn">Task Done</button>
            </div>
        </div>
        <div class="box-content">
            <div class="content content-all-task">
                <div class="header-content">
                    <div class="time-info-header">
                        <h1>Task List</h1>
                        <p>Here all of your tasks</p>
                    </div>
                    <button class="new-task-btn">
                        <span>
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path d="M12 4.5V19.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                                <path d="M19.5 12H4.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                            </svg>                            
                        </span>
                        New Task
                    </button>
                </div>
                <div class="tasks" id="all-task-here">
                    
                </div>
            </div>
            <div class="content content-today hide">
                <div class="header-content">
                    <div class="time-info-header">
                        <h1>Today's Task</h1>
                        <p id="today-time-info">Wednesday, 11 May</p>
                    </div>
                    <button class="new-task-btn">
                        <span>
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path d="M12 4.5V19.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                                <path d="M19.5 12H4.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                            </svg>                            
                        </span>
                        New Task
                    </button>
                </div>
                <div class="tabs">
                    <button class="urgent">Urgent (<span id="count-urgent"></span>)</button>
                    <button class="normal" > Normal (<span id="count-normal"></span>)</button>
                    <button class="low">Low (<span id="count-low"></span>)</button>
                </div>
                <div class="tasks" id="task-today-urgent">

                </div>
                <div class="tasks hide" id="task-today-normal">
                    
                </div>
                <div class="tasks hide" id="task-today-low">
                    
                </div>
            </div>
            <div class="content content-task-done hide">
                <p>task done</p>
            </div>
        </div>
    </div>

    <div class="out-add-task">
        <div class="box-add-task">
            <div class="task-input">
                <textarea id="task" placeholder="Tulis tugas di sini..."></textarea>
                <select id="priority">
                    <option value="Low">Low</option>
                    <option value="Normal">Normal</option>
                    <option value="Urgent">Urgent</option>
                </select>
                <!-- jadwal -->
                 <div class="date-picker">
                    <input type="date" id="day-schedule">
                    <input type="time" id="start-schedule">
                    <input type="time" id="end-schedule">

                    <p id="formatted-date"></p>
                 </div>
                <button id="submit">Submit</button>
            </div>
        </div>
    </div>

    <script>
        let Containeralltaskhere = document.getElementById('all-task-here');
        let Btnsubmit = document.getElementById('submit');
        let Taskinput = document.getElementById('task');
        let Priorityinput = document.getElementById('priority');
        let Dayschedule = document.getElementById('day-schedule');
        let Startschedule = document.getElementById('start-schedule');
        let Endschedule = document.getElementById('end-schedule');
        let formatteddate = document.getElementById('formatted-date');
        const hari = ["Minggu", "Senin", "Selasa", "Rabu", "Kamis", "Jumat", "Sabtu"];

        // Ambil data tugas yang sudah ada di localStorage, atau buat array kosong jika belum ada
        let tasks = JSON.parse(localStorage.getItem('tasksData')) || [];
        

        // mengubah format tanggal 
        Dayschedule.addEventListener('change', function() {
            const dateValue = this.value;
            if (dateValue) {
                // Membuat objek Date dari input yang dipilih
                const date = new Date(dateValue);
                
                // Menentukan hari dalam minggu
                const dayName = hari[date.getDay()]; // getDay() mengembalikan angka 0-6 (Minggu=0, Senin=1, dst)

                // Mendapatkan tanggal, bulan, dan tahun
                const day = date.getDate();
                const month = date.toLocaleString('id-ID', { month: 'long' }); // Format bulan dalam bahasa Indonesia
                const year = date.getFullYear();

                // Membuat string tanggal dalam format: Hari, Tanggal Bulan Tahun
                const formattedDate = `${dayName}, ${day} ${month} ${year}`;

                // Menampilkan hasil format tanggal
                document.getElementById('formatted-date').textContent = formattedDate;
            }
        });

        Btnsubmit.addEventListener('click', function() {
            let task = Taskinput.value.trim();
            let priority = Priorityinput.value.trim();
            let dayschedule = formatteddate.textContent.trim();
            let startschedule = Startschedule.value.trim();
            let endschedule = Endschedule.value.trim();
            // Cek apakah tasklist sudah ada di localStorage
            let tasklist = JSON.parse(localStorage.getItem('tasksData')) || [];

            // Generate ID baru yang unik
            let id = Math.floor(Math.random() * 1000000000) + 1; // ID acak

            // Pastikan ID yang dihasilkan unik
            while (tasklist.some((task) => task.id === id)) {
                id = Math.floor(Math.random() * 1000000000) + 1;
            }

            // Menyimpan ID yang unik
            let getidresult = id;

            if (task !== '') {
                let newtask = document.createElement('div');
                newtask.className = "task active";
                if (priority === 'Urgent') {
                    newtask.classList.add("task-urgent");
                } else if (priority === 'Normal') {
                    newtask.classList.add("task-normal");
                } else if (priority === 'Low') {
                    newtask.classList.add("task-low");
                }

                newtask.innerHTML = `
                <div>
                <span class="task-id hide">${getidresult}</span>
                <h2>${task}</h2>
                <p>${dayschedule} | ${startschedule} - ${endschedule}</p>
                <p id="pr-s"> Priority: ${priority}</p>
                </div>
                <div class="status">
                <button type="button" title="done" class="task-done-button"></button>
                </div>
                `;
                Containeralltaskhere.appendChild(newtask);
                saveTaskToLocalStorage(getidresult, task, dayschedule, startschedule, endschedule, priority)
                showurgentData();
                shownormalData();
                showlowData();
            }
        });

        // Fungsi untuk menyimpan tugas ke localStorage
        function saveTaskToLocalStorage(getidresult, task, dayschedule, startschedule, endschedule, priority) {

            // Buat objek tugas baru dengan menambahkan status completed
            let newTask = {
                id: getidresult,      
                title: task,           
                dayschedule: dayschedule,  
                startschedule: startschedule,
                endschedule: endschedule,  
                priority: priority,   
                completed: false    
            };

            // Tambahkan tugas baru ke array
            tasks.push(newTask);

            // Simpan kembali array tugas ke localStorage
            localStorage.setItem('tasksData', JSON.stringify(tasks));
        }

        function loadTasksFromLocalStorage() {
            
            if(tasks.length > 0) {
                tasks.forEach((taskdata) => {
                    let newtask = document.createElement('div');
                    newtask.className = "task active";
                    newtask.innerHTML = `
                    <div>
                    <span class="task-id" style="display: none;">${taskdata.id}</span>
                    <h2>${taskdata.title}</h2>
                    <p>${taskdata.dayschedule} | ${taskdata.startschedule} - ${taskdata.endschedule}</p>
                    <p id="pr-s"> Priority: ${taskdata.priority}</p>
                </div>
                <div class="status">
                    <button type="button" title="done" class="task-done-button"></button>
                </div>
                `;

                if (taskdata.completed) {
                    newtask.classList.add('hide');
                }

                Containeralltaskhere.append(newtask);

                });
            }

        }

        document.addEventListener("DOMContentLoaded", loadTasksFromLocalStorage);

    </script>

    <!-- header option button  -->
    <script>
        let Btnlistheaderbtn = document.querySelectorAll('.list-header-btn button');
let todayBtn = document.querySelector('.today-btn');
let allBtn = document.querySelector('.all-btn');
let donebtn = document.querySelector('.done-btn');

let Cardcontenttoday = document.querySelector('.content-today');
let Cardcontentalltask = document.querySelector('.content-all-task');
let Cardcontenttaskdone = document.querySelector('.content-task-done');

// Menyimpan status tombol aktif ke localStorage
Btnlistheaderbtn.forEach((btn, index) => {
    btn.addEventListener('click', () => {
        // Hapus kelas 'active' dari semua tombol
        Btnlistheaderbtn.forEach((btn) => {
            btn.classList.remove('active');
        });
        btn.classList.add('active');
        
        // Simpan status aktif untuk Btnlistheaderbtn ke localStorage
        localStorage.setItem('activeButtonIndex', index);

        // Menyimpan status aktif pada tombol lainnya (todayBtn, allBtn, donebtn)
        localStorage.setItem('activeTodayBtn', todayBtn.classList.contains('active'));
        localStorage.setItem('activeAllBtn', allBtn.classList.contains('active'));
        localStorage.setItem('activeDoneBtn', donebtn.classList.contains('active'));

        // Simpan status visibility konten
        localStorage.setItem('contentTodayVisible', !Cardcontenttoday.classList.contains('hide'));
        localStorage.setItem('contentAllTaskVisible', !Cardcontentalltask.classList.contains('hide'));
        localStorage.setItem('contentTaskDoneVisible', !Cardcontenttaskdone.classList.contains('hide'));
    });
});

// Menyimpan status tombol lainnya (todayBtn, allBtn, donebtn) ke localStorage
todayBtn.addEventListener('click', function() {
    Cardcontenttoday.classList.remove('hide');
    Cardcontentalltask.classList.add('hide');
    Cardcontenttaskdone.classList.add('hide');
    showurgentData();
    shownormalData();
    showlowData();

    // Menyimpan status aktif pada todayBtn ke localStorage
    localStorage.setItem('activeTodayBtn', true);
    localStorage.setItem('activeAllBtn', false);
    localStorage.setItem('activeDoneBtn', false);

    // Menyimpan status visibility konten
    localStorage.setItem('contentTodayVisible', true);
    localStorage.setItem('contentAllTaskVisible', false);
    localStorage.setItem('contentTaskDoneVisible', false);
});

allBtn.addEventListener('click', function() {
    Cardcontenttoday.classList.add('hide');
    Cardcontentalltask.classList.remove('hide');
    Cardcontenttaskdone.classList.add('hide');

    // Menyimpan status aktif pada allBtn ke localStorage
    localStorage.setItem('activeAllBtn', true);
    localStorage.setItem('activeTodayBtn', false);
    localStorage.setItem('activeDoneBtn', false);

    // Menyimpan status visibility konten
    localStorage.setItem('contentTodayVisible', false);
    localStorage.setItem('contentAllTaskVisible', true);
    localStorage.setItem('contentTaskDoneVisible', false);
});

donebtn.addEventListener('click', function() {
    Cardcontenttoday.classList.add('hide');
    Cardcontentalltask.classList.add('hide');
    Cardcontenttaskdone.classList.remove('hide');

    // Menyimpan status visibility konten
    localStorage.setItem('contentTodayVisible', false);
    localStorage.setItem('contentAllTaskVisible', false);
    localStorage.setItem('contentTaskDoneVisible', true);
});

// Mengambil status aktif tombol dan konten dari localStorage saat halaman dimuat
window.addEventListener('load', () => {
    // Mengambil status tombol yang aktif untuk Btnlistheaderbtn
    let activeButtonIndex = localStorage.getItem('activeButtonIndex');
    if (activeButtonIndex !== null) {
        // Jika ada tombol yang aktif, tambahkan kelas 'active' pada tombol tersebut
        Btnlistheaderbtn[activeButtonIndex].classList.add('active');
    } else {
        // Jika tidak ada status aktif yang disimpan, set tombol pertama menjadi aktif
        Btnlistheaderbtn[0].classList.add('active');
    }


    // Mengambil status visibility konten dari localStorage
    if (localStorage.getItem('contentTodayVisible') === 'true') {
        Cardcontenttoday.classList.remove('hide');
    } else {
        Cardcontenttoday.classList.add('hide');
    }

    if (localStorage.getItem('contentAllTaskVisible') === 'true') {
        Cardcontentalltask.classList.remove('hide');
    } else {
        Cardcontentalltask.classList.add('hide');
    }

    if (localStorage.getItem('contentTaskDoneVisible') === 'true') {
        Cardcontenttaskdone.classList.remove('hide');
    } else {
        Cardcontenttaskdone.classList.add('hide');
    }
});


    </script>

    <!-- tabs urgent, normal, low button  -->
    <script>
        let TabsBtn = document.querySelectorAll('.tabs button');
        let Btnurgent = document.querySelector('.urgent');
        let Btnnormal = document.querySelector('.normal');
        let Btnlow = document.querySelector('.low');

        let Containertasktodayurgent = document.getElementById('task-today-urgent');
        let Containertasktodaynormal = document.getElementById('task-today-normal');
        let Containertasktodaylow = document.getElementById('task-today-low');

        TabsBtn.forEach((btn, index) => {
            btn.addEventListener('click', function() {
                TabsBtn.forEach((btn) => {
                    btn.classList.remove('active');
                });
                btn.classList.add('active');
                // Simpan status aktif untuk Btnlistheaderbtn ke localStorage
                localStorage.setItem('activeSubButtonIndex', index);
            });
        });

        window.addEventListener('load', () => {
            // Mengambil status tombol yang aktif untuk Btnlistheaderbtn
            let activeSubButtonIndex = localStorage.getItem('activeSubButtonIndex');
            if (activeSubButtonIndex !== null) {
                // Jika ada tombol yang aktif, tambahkan kelas 'active' pada tombol tersebut
                TabsBtn[activeSubButtonIndex].classList.add('active');
            } else {
                // Jika tidak ada status aktif yang disimpan, set tombol pertama menjadi aktif
                TabsBtn[0].classList.add('active');
            }
        });

        function showurgentData() {
            // Ambil tanggal hari ini dalam format yang sama dengan 'dayschedule'
            let today = new Date();
            let dayOfWeek = today.toLocaleString('id-ID', { weekday: 'long' }); 
            let dayOfMonth = today.getDate(); 
            let month = today.toLocaleString('id-ID', { month: 'long' }); 
            let year = today.getFullYear(); 
            
            let formattedToday = `${dayOfWeek}, ${dayOfMonth} ${month} ${year}`;

            let todaytaskUrgent = tasks.filter(item => item.dayschedule === formattedToday && item.priority === "Urgent" && item.completed === false );

            Containertasktodayurgent.innerHTML = '';
            let counturgent = document.getElementById('count-urgent');
            counturgent.innerHTML = todaytaskUrgent.length;

            if(todaytaskUrgent.length === 0) {
                let noDataMessage = document.createElement('p');
                noDataMessage.textContent = 'No Data';
                Containertasktodayurgent.appendChild(noDataMessage);
            } else {
                todaytaskUrgent.forEach((taskData) => {
                    let cardtask = document.createElement('div');
                    cardtask.className = "task";
                    cardtask.innerHTML = `
                    <div>
                        <span class="task-id hide">${taskData.id}</span>
                        <h2>${taskData.title}</h2>
                        <p>${taskData.dayschedule} | ${taskData.startschedule} - ${taskData.endschedule}</p>
                        <p id="pr-s"> Priority: ${taskData.priority}</p>
                    </div>
                    <div class="status">
                        <button type="button" title="done" class="task-done-button"></button>
                    </div>
                    `;
                    Containertasktodayurgent.appendChild(cardtask);
                });
            }
        }

        function shownormalData() {
            // Ambil tanggal hari ini dalam format yang sama dengan 'dayschedule'
            let today = new Date();
            let dayOfWeek = today.toLocaleString('id-ID', { weekday: 'long' }); 
            let dayOfMonth = today.getDate(); 
            let month = today.toLocaleString('id-ID', { month: 'long' }); 
            let year = today.getFullYear(); 
            
            let formattedToday = `${dayOfWeek}, ${dayOfMonth} ${month} ${year}`;

            let todaytaskNormal = tasks.filter(item => item.dayschedule === formattedToday && item.priority === "Normal" && item.completed === false );

            Containertasktodaynormal.innerHTML = '';
            let countnormal = document.getElementById('count-normal');
            countnormal.innerHTML = todaytaskNormal.length;

            if(todaytaskNormal.length === 0) {
                let noDataMessage = document.createElement('p');
                noDataMessage.textContent = 'No Data';
                Containertasktodaynormal.appendChild(noDataMessage);
            } else {
                todaytaskNormal.forEach((taskData) => {
                    let cardtask = document.createElement('div');
                    cardtask.className = "task";
                    cardtask.innerHTML = `
                    <div>
                        <span class="task-id hide">${taskData.id}</span>
                        <h2>${taskData.title}</h2>
                        <p>${taskData.dayschedule} | ${taskData.startschedule} - ${taskData.endschedule}</p>
                        <p id="pr-s"> Priority: ${taskData.priority}</p>
                    </div>
                    <div class="status">
                        <button type="button" title="done" class="task-done-button"></button>
                    </div>
                    `;
                    Containertasktodaynormal.appendChild(cardtask);
                });
            }
        }

        function showlowData() {
            // Ambil tanggal hari ini dalam format yang sama dengan 'dayschedule'
            let today = new Date();
            let dayOfWeek = today.toLocaleString('id-ID', { weekday: 'long' }); 
            let dayOfMonth = today.getDate(); 
            let month = today.toLocaleString('id-ID', { month: 'long' }); 
            let year = today.getFullYear(); 
            
            let formattedToday = `${dayOfWeek}, ${dayOfMonth} ${month} ${year}`;

            let todaytaskLow = tasks.filter(item => item.dayschedule === formattedToday && item.priority === "Low" && item.completed === false );

            Containertasktodaylow.innerHTML = '';
            let countlow = document.getElementById('count-low');
            countlow.innerHTML = todaytaskLow.length;

            if(todaytaskLow.length === 0) {
                let noDataMessage = document.createElement('p');
                noDataMessage.textContent = 'No Data';
                Containertasktodaylow.appendChild(noDataMessage);
            } else {
                todaytaskLow.forEach((taskData) => {
                    let cardtask = document.createElement('div');
                    cardtask.className = "task";
                    cardtask.innerHTML = `
                    <div>
                        <span class="task-id hide">${taskData.id}</span>
                        <h2>${taskData.title}</h2>
                        <p>${taskData.dayschedule} | ${taskData.startschedule} - ${taskData.endschedule}</p>
                        <p id="pr-s"> Priority: ${taskData.priority}</p>
                    </div>
                    <div class="status">
                        <button type="button" title="done" class="task-done-button"></button>
                    </div>
                    `;
                    Containertasktodaylow.appendChild(cardtask);
                });
            }
        }

        function urgentData() {
            Containertasktodayurgent.classList.remove('hide');
            Containertasktodaynormal.classList.add('hide');
            Containertasktodaylow.classList.add('hide');
        }

        function normalData() {
            Containertasktodayurgent.classList.add('hide');
            Containertasktodaynormal.classList.remove('hide');
            Containertasktodaylow.classList.add('hide');
        }

        function lowData() {
            Containertasktodayurgent.classList.add('hide');
            Containertasktodaynormal.classList.add('hide');
            Containertasktodaylow.classList.remove('hide');
        }

        Btnurgent.addEventListener('click', function() {
            urgentData();
            showurgentData();
        });

        Btnnormal.addEventListener('click', function() {
            normalData();
            shownormalData();
        });

        Btnlow.addEventListener('click', function() {
            lowData();
            showlowData();
        });

    </script>

    <!-- done button  -->
     <script>
        document.addEventListener('click', function(event) {
            if (event.target.classList.contains('task-done-button')) {
                let closestTask = event.target.closest('.task');
                if (closestTask) {
                    closestTask.remove();

                    // Ambil ID tugas dari elemen task-id
                    let taskId = closestTask.querySelector('.task-id').textContent.trim();  // Pastikan ID yang diambil adalah string

                    // Ambil data tugas yang sudah ada di localStorage
                    let tasks = JSON.parse(localStorage.getItem('tasksData')) || [];

                    // Temukan task dengan ID yang sesuai
                    let task = tasks.find(task => task.id == taskId); // Menggunakan '==' untuk pengecekan ID, pastikan tipe data ID konsisten

                    if (task) {
                        task.completed = true; 
                    }

                    // refresh page 
                    window.location.reload();

                    localStorage.setItem('tasksData', JSON.stringify(tasks)); 
                }

            }
        });
     </script>
